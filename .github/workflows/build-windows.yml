name: build-windows

on:
  workflow_dispatch:
  push:
    branches: [ main, ero-0.1d, ero-0.1e2-mo2-lifecycle ]

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify Smithbox pin
        shell: pwsh
        run: |
          $sha = git -C external/Smithbox rev-parse HEAD
          if ($sha -ne "f5969c060cea240476e9dd4d6a64eafa9dbafaab") {
            throw "Unexpected Smithbox revision: $sha"
          }

      - name: Restore
        run: dotnet restore EldenRingOrganizer.slnx

      - name: Build
        run: dotnet build EldenRingOrganizer.slnx -c Release --no-restore

      - name: Test
        shell: pwsh
        run: |
          $tests = Get-ChildItem -Recurse -Filter *.csproj | Where-Object {
            $_.FullName -notmatch '[\\/]external[\\/]' -and $_.FullName -match '[\\/]tests?[\\/]'
          }
          if ($tests) {
            foreach ($test in $tests) {
              dotnet test $test.FullName -c Release --no-build
            }
          } else {
            Write-Host "No ERO test projects present."
          }

      - name: Publish
        run: dotnet publish src/EldenRingOrganizer.App/EldenRingOrganizer.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o artifacts/EldenRingOrganizer

      - name: Add runtime directories
        shell: pwsh
        run: |
          "mods", "profiles", "cache", "generated", "logs" | ForEach-Object {
            New-Item -ItemType Directory -Path "artifacts/EldenRingOrganizer/$_" -Force | Out-Null
          }

      - name: Smoke test isolated mod installer
        shell: pwsh
        run: |
          $root = Join-Path $PWD "artifacts/EldenRingOrganizer"
          $fixture = Join-Path $PWD "artifacts/install-fixture"
          $payload = Join-Path $fixture "Example Mod"
          $archive = Join-Path $PWD "artifacts/example-mod.zip"
          $mods = Join-Path $PWD "artifacts/test-mods"
          $cache = Join-Path $PWD "artifacts/test-cache"
          $logs = Join-Path $PWD "artifacts/test-logs"
          $log = Join-Path $logs "installer-helper.log"
          $result = Join-Path $cache "install-result.json"

          New-Item -ItemType Directory -Path $payload -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $payload "parts") -Force | Out-Null
          Set-Content -Path (Join-Path $payload "regulation.bin") -Value "synthetic regulation payload"
          Set-Content -Path (Join-Path $payload "parts/readme.txt") -Value "synthetic loose file"

          Compress-Archive -Path $payload -DestinationPath $archive

          New-Item -ItemType Directory -Path $mods, $cache, $logs -Force | Out-Null

          $psi = [System.Diagnostics.ProcessStartInfo]::new()
          $psi.FileName = Join-Path $root "EldenRingOrganizer.exe"
          $psi.WorkingDirectory = $root
          $psi.UseShellExecute = $false
          $psi.CreateNoWindow = $true
          @("--install-mod", $archive, $mods, $cache, $log, $result) | ForEach-Object {
            [void]$psi.ArgumentList.Add($_)
          }

          $process = [System.Diagnostics.Process]::Start($psi)
          $process.WaitForExit()

          if ($process.ExitCode -ne 0) {
            if (Test-Path $log) { Get-Content $log }
            throw "Isolated installer smoke test failed with exit code $($process.ExitCode)"
          }

          if (-not (Test-Path $result)) {
            throw "Installer helper did not write its transaction result."
          }

          $install = Get-Content $result -Raw | ConvertFrom-Json
          if (-not (Test-Path $install.RootPath)) {
            throw "Committed mod root is missing: $($install.RootPath)"
          }
          if (-not (Test-Path (Join-Path $install.RootPath "regulation.bin"))) {
            throw "Committed regulation.bin is missing."
          }
          if (-not (Test-Path (Join-Path $install.RootPath "parts/readme.txt"))) {
            throw "Committed loose file is missing."
          }
          if (-not (Test-Path (Join-Path $install.RootPath "ero.mod.json"))) {
            throw "Committed mod manifest is missing."
          }

      - name: Verify publish output
        shell: pwsh
        run: |
          $root = "artifacts/EldenRingOrganizer"
          $required = @(
            "EldenRingOrganizer.exe",
            "Smithbox.Program.dll",
            "Andre.Formats.dll",
            "Andre.SoulsFormats.dll",
            "Assets\PARAM\ER",
            "Assets\FMG\ER\Fmg Descriptor Registry.json",
            "Assets\FMG\Templates\ER_Infusion.json",
            "Assets\File Dictionaries\ER-File-Dictionary.json",
            "Assets\Localization",
            "Assets\UXM Dictionaries\EldenRingDictionary.txt",
            "Licenses\Smithbox-LICENSE.txt",
            "glfw3.dll",
            "cimgui.dll"
          )

          foreach ($entry in $required) {
            if (-not (Test-Path (Join-Path $root $entry))) {
              throw "Required publish asset missing: $entry"
            }
          }

          $files = Get-ChildItem $root -File -Recurse
          Write-Host "Published file count: $($files.Count)"
          Write-Host "Published size: $([Math]::Round(($files | Measure-Object Length -Sum).Sum / 1MB, 2)) MB"
          Get-ChildItem (Join-Path $root "Assets\PARAM\ER\Defs") -Filter *.xml | Select-Object -First 10 Name

      - uses: actions/upload-artifact@v4
        with:
          name: EldenRingOrganizer-0.1E2-MO2Lifecycle-win-x64
          path: artifacts/EldenRingOrganizer
          if-no-files-found: error
          include-hidden-files: true
