name: build-windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore EldenRingOrganizer.slnx

      - name: Build
        run: dotnet build EldenRingOrganizer.slnx -c Release --no-restore

      - name: Test
        shell: pwsh
        run: |
          $tests = Get-ChildItem -Recurse -Filter *.csproj | Where-Object { $_.FullName -match '[\\/]tests?[\\/]' }
          if ($tests) {
            foreach ($test in $tests) {
              dotnet test $test.FullName -c Release --no-build
            }
          } else {
            Write-Host "No test projects present."
          }

      - name: Publish
        run: dotnet publish src/EldenRingOrganizer.App/EldenRingOrganizer.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/EldenRingOrganizer

      - name: Add runtime directories
        shell: pwsh
        run: |
          "mods", "profiles", "cache", "generated", "logs" | ForEach-Object { New-Item -ItemType Directory -Path "artifacts/EldenRingOrganizer/$_" -Force | Out-Null }

      - name: Verify publish output
        shell: pwsh
        run: |
          if (-not (Test-Path "artifacts/EldenRingOrganizer/EldenRingOrganizer.exe")) {
            throw "EldenRingOrganizer.exe was not produced."
          }
          Get-ChildItem "artifacts/EldenRingOrganizer" -Recurse | Select-Object FullName, Length

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path "artifacts/EldenRingOrganizer/*" -DestinationPath "artifacts/EldenRingOrganizer-0.1C-win-x64.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: EldenRingOrganizer-0.1C-win-x64
          path: artifacts/EldenRingOrganizer-0.1C-win-x64.zip
          if-no-files-found: error
